name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gitlab_version:
        description: 'Upstream gitlab/gitlab-ce tag to base on (e.g. 18.11.3-ce.0)'
        required: true
        default: '18.11.3-ce.0'

# Single concurrent build per ref; cancel in-progress on a new push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Docker registry tags must be all-lowercase. github.repository is
  # "Coffeehedake/gitlab-runner-patched" (capital C) which fails validation,
  # so we hardcode the lowercased form here.
  IMAGE_NAME: coffeehedake/gitlab-runner-patched

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk for the giant base image
        # Default GHA runners have ~14 GB free. gitlab/gitlab-ce is ~3 GB,
        # our final image is ~4 GB once the C/C++ toolchain layer is included,
        # plus buildx cache. Strip non-essentials aggressively.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules || true
          sudo rm -rf /usr/share/swift /usr/share/miniconda /usr/local/share/powershell || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h /

      - name: Determine base version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.gitlab_version }}" ]; then
            v='${{ github.event.inputs.gitlab_version }}'
          else
            v='18.11.3-ce.0'
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "Using GitLab base version: $v"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagging strategy
      # ----------------
      # `:<version>` and `:latest` are MOVING tags -- every build overwrites
      # them. Deployments pin one of those, which means a bad build silently
      # replaces the image a re-pull would fetch, leaving nothing to roll back
      # to.
      #
      # So we also push two IMMUTABLE tags that are never reused:
      #   :<version>-r<run_number>   monotonic, easy to reason about
      #   :<version>-<short_sha>     ties an image to the exact source commit
      #
      # To roll back: point the Unraid template's Repository field at the last
      # known-good immutable tag and re-pull. To roll forward again, put the
      # moving tag back.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GITLAB_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-r${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}

      # Smoke-test the image before anyone deploys it. This catches a broken
      # toolchain layer here rather than after GitLab has been taken down.
      - name: Smoke test the built image
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          docker pull "$IMG"
          echo "--- toolchain ---"
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            cmake --version | head -1
            ninja --version
            gcc --version | head -1
            g++ --version | head -1
            clang --version | head -1
            clang-tidy --version | head -1
            command -v clang-tidy
            python3 --version
            node --version
            gitlab-runner --version | head -1
            docker --version
            docker buildx version
            docker compose version
            google-chrome-stable --version
            /usr/bin/python3 -c "import markdown; print(\"markdown\", markdown.__version__)"
            test -x /usr/local/bin/link-runner-service.sh
            test -x /opt/gitlab/sv/gitlab-runner/run
            echo "all required tooling present"
          '
          echo "--- CI python (Layer 2d) ---"
          # `test -x ci-python` would pass for a broken interpreter, and
          # `ci-python --version` would pass for one that cannot import sqlite3
          # or build a venv -- which is precisely the state /usr/bin/python3.12
          # is in inside this image. So exercise the two things CI actually
          # needs and let a failure be a failed build.
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            uv --version
            ci-python -c "import sys, sqlite3; assert sys.version_info[:2] == (3, 13), sys.version; print(\"ci-python\", sys.version.split()[0], \"sqlite3\", sqlite3.sqlite_version)"
            ci-python -m venv /tmp/smoke-venv
            /tmp/smoke-venv/bin/python -c "import sqlite3; print(\"venv creation OK\")"
            /tmp/smoke-venv/bin/pip --version
            rm -rf /tmp/smoke-venv
            ruff --version
            pytest --version
            echo "CI python toolchain present and usable"
          '
          echo "--- the shadowing this layer works around is still real ---"
          # Asserted rather than described. If a future base image ever puts a
          # working python3 first on PATH, this fails and someone gets to delete
          # a workaround instead of inheriting it forever. If it still resolves
          # to the embedded interpreter, that is the status quo and the reason
          # ci-python is not called python3.
          docker run --rm --entrypoint sh "$IMG" -c '
            resolved=$(command -v python3)
            echo "python3 resolves to: $resolved"
            case "$resolved" in
              /opt/gitlab/embedded/bin/python3)
                echo "OK: still shadowed by omnibus, ci-python is still required" ;;
              *)
                echo "CHANGED: python3 now resolves elsewhere - re-evaluate Layer 2d"; exit 1 ;;
            esac
          '

      - name: Assert the runner shim is actually WIRED IN as CMD
        run: |
          # `test -x` above proves the file exists. It does NOT prove anything runs
          # it: a Dockerfile edit that drops the CMD line leaves a perfectly
          # executable script nobody invokes, and every other check stays green
          # while CI silently stalls at `pending` after the next recreate.
          cmd=$(docker inspect --format '{{json .Config.Cmd}}' \
                "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-r${{ github.run_number }}")
          echo "Config.Cmd = $cmd"
          case "$cmd" in
            *link-runner-service.sh*) echo "OK: shim is the image CMD" ;;
            *) echo "FAIL: image CMD does not invoke link-runner-service.sh"; exit 1 ;;
          esac

          # NOTE: this is still only a WIRING check. The shim's guard tests for
          # /opt/gitlab/service/{sidekiq,puma}; if an omnibus upgrade renames those,
          # the loop runs forever doing nothing and BOTH checks above still pass.
          # The behavioural assertion - remove the symlink, watch it come back -
          # needs a running container with omnibus populated, so it lives in
          # fatalexception/gitlab-ce -> scripts/verify-runner-selfheal.sh and is
          # run post-deploy. Do not treat these two as covering that.

      - name: Report immutable tags
        run: |
          echo "Rollback-safe tags published:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-r${{ github.run_number }}"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}"
