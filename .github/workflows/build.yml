name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gitlab_version:
        description: 'Upstream gitlab/gitlab-ce tag to base on (e.g. 18.11.3-ce.0)'
        required: true
        default: '18.11.3-ce.0'

# Single concurrent build per ref; cancel in-progress on a new push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Docker registry tags must be all-lowercase. github.repository is
  # "Coffeehedake/gitlab-runner-patched" (capital C) which fails validation,
  # so we hardcode the lowercased form here.
  IMAGE_NAME: coffeehedake/gitlab-runner-patched

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk for the giant base image
        # Default GHA runners have ~14 GB free. gitlab/gitlab-ce is ~3 GB,
        # our final image is ~3.3 GB, plus buildx cache. Strip non-essentials.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Determine base version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.gitlab_version }}" ]; then
            v='${{ github.event.inputs.gitlab_version }}'
          else
            v='18.11.3-ce.0'
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Using GitLab base version: $v"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GITLAB_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify pushed manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
